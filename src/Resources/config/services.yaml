services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Wexample\SymfonyTunnels\:
        resource: '../../{Command,Repository,Service,Twig}'
        exclude: '../../Service/**/Abstract*.php'
        tags: ['controller.service_arguments']

    Wexample\SymfonyTunnels\Interface\TunnelSessionStorageInterface:
        alias: Wexample\SymfonyTunnels\Service\TunnelSessionService

    Wexample\SymfonyTunnels\Routing\TunnelRouteLoader:
        arguments:
            $controllerClasses: '%wexample_symfony_tunnels.controllers%'
            $container: '@service_container'
        tags:
            - { name: 'routing.loader' }

    # A tag rather than #[AsPeriodicTask]: an application linking this package
    # before installing symfony/scheduler would not compile with the attribute,
    # while a tag nobody reads is left alone.
    Wexample\SymfonyTunnels\Service\TunnelRegistry:
        tags:
            - name: 'scheduler.task'
              trigger: 'every'
              frequency: !php/const Wexample\SymfonyTunnels\Service\TunnelRegistry::PURGE_FREQUENCY
              method: 'purgeExpiredSessions'
