framework:
  test: true
  secret: "test"
  session:
    storage_factory_id: session.storage.factory.mock_file

wexample_symfony_loader:
  front_paths:
    front: '%kernel.project_dir%/../front/'

twig:
  default_path: '%kernel.project_dir%/templates'

doctrine:
  orm:
    enable_native_lazy_objects: true

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: true

  Wexample\SymfonyTunnels\Tests\Fixtures\Tunnel\:
    resource: '../../Tunnel/'
    exclude: '../../Tunnel/{Cycle,InMemoryTunnelSessionStorage.php}'

  Wexample\SymfonyTunnels\Tests\Fixtures\App\Controller\:
    resource: '../Controller/'
    tags: ['controller.service_arguments']

  # symfony-testing registers it with the string '@kernel' instead of a
  # reference, which only YAML turns into the kernel service.
  Wexample\SymfonyHelpers\Service\BundleService:
    arguments: ['@kernel']
